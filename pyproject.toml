[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilotage-agent"
version = "0.1.0"
description = "A personal, opinionated AI agent runtime for a controlled deployment."
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai==2.24.0",
    "Pillow==12.3.0",
    "httpx[socks]==0.28.1",
    "python-telegram-bot[webhooks]==22.8",
    "pyyaml==6.0.3",
    "croniter==6.0.0",
    "ddgs==9.15.0",
    "firecrawl-py==4.17.0",
    "tzdata==2025.3; sys_platform == 'win32'",
]

[dependency-groups]
chart = [
    "matplotlib==3.11.0",
    "numpy==2.4.6",
]
docs = [
    "defusedxml==0.7.1",
    "lxml==6.1.1",
    "markitdown[pptx,xlsx]==0.1.6",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "pdf2image==1.17.0",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "pypdf==6.14.2",
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "reportlab==5.0.0",
]
excel = [
    "xlsxwriter==3.2.9",
]
pdf = [
    "jinja2==3.1.6",
    "pydyf==0.12.1",
    "weasyprint==69.0",
]

[project.scripts]
pilotage = "pilotage.main:main"

[tool.setuptools.packages.find]
include = ["pilotage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
